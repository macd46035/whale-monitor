name: Hourly Whale Snapshot

# 하이퍼리퀴드 고래 20곳의 BTC·ETH 롱/숏 노출을 1시간마다 data/snapshots.json 에 기록합니다.
# index.html 은 이 파일을 읽어, 체결 복원이 닿지 않는 구간을 실측 스냅샷으로 채웁니다.

on:
  schedule:
    # 매시 정각(UTC). GitHub Actions 의 cron 은 UTC 기준이라 KST 매시 :00 과 같습니다.
    - cron: '0 * * * *'
  workflow_dispatch: # 수동 실행(테스트·즉시 기록용)

permissions:
  contents: write # GITHUB_TOKEN 으로 data/snapshots.json 커밋·푸시

concurrency:
  group: whale-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Take snapshot
        # 수동 실행은 '지금 당장 한 장' 이므로 30분 중복 방지 창을 무시합니다.
        env:
          SNAP_ARGS: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: python3 scripts/snapshot.py $SNAP_ARGS

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- data/snapshots.json)" ]; then
            echo "::notice::data/snapshots.json 변경 없음 — 커밋 생략"
            exit 0
          fi
          git add data/snapshots.json
          git commit -m "chore: hourly whale snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
          echo "::notice::스냅샷 커밋 완료 $(git rev-parse --short HEAD)"
